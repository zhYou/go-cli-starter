name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GO_CLI_STARTER_HOME: ${{ runner.temp }}/go-cli-starter-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      - run: mise run setup
      - name: 原生进程树、取消与资源所有权验收
        env:
          GO_CLI_STARTER_HOME: ${{ runner.temp }}/native-command-home
        run: mise exec -- go test -count=1 -timeout=90s ./internal/tools/command -run 'Test(Windows|OwnedDescendants|RootExits|CleanupDoes|CancellationRetains)'
      - run: mise run check
      - name: 比较事件基准的机器契约
        env:
          CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$CONTRACT_BASE" ] && [ "$CONTRACT_BASE" != "0000000000000000000000000000000000000000" ]; then
            mise run contract:check -- --against "$CONTRACT_BASE"
          fi
      - run: mise run test:fuzz
      - run: mise run test:bench
      - run: mise run test:race
      - run: mise run mcp:check
      - run: mise run release:snapshot
      - run: mise run release:verify
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GO_CLI_STARTER_HOME: ${{ runner.temp }}/go-cli-starter-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      - run: mise run setup
      - name: 原生进程树、取消与资源所有权验收
        env:
          GO_CLI_STARTER_HOME: ${{ runner.temp }}/native-command-home
        run: mise exec -- go test -count=1 -timeout=90s ./internal/tools/command -run 'Test(Windows|OwnedDescendants|RootExits|CleanupDoes|CancellationRetains)'
      - name: 原生模板构建与二进制验收
        env:
          GO_CLI_STARTER_HOME: ${{ runner.temp }}/template-starter-home
          MYCLI_HOME: ${{ runner.temp }}/template-mycli-home
        run: mise exec -- go test -count=1 ./tools/dev -run '^TestTemplateExecutable(Path|Acceptance)$'
      - run: mise run test
      - run: mise run build
