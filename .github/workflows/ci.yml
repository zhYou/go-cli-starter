name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 隔离应用状态目录
        shell: bash
        env:
          GO_CLI_STARTER_HOME: ${{ runner.temp }}/go-cli-starter-home
        run: |
          printf 'GO_CLI_STARTER_HOME=%s\n' "$GO_CLI_STARTER_HOME" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      - run: mise run setup
      - name: 原生进程树、取消与资源所有权验收
        env:
          GO_CLI_STARTER_HOME: ${{ runner.temp }}/native-command-home
        run: mise exec -- go test -count=1 -timeout=90s ./internal/command -run 'Test(Windows|OwnedDescendants|RootExits|CleanupDoes|CancellationRetains)'
      - run: mise run check
      - name: 比较事件基准的机器契约
        env:
          CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$CONTRACT_BASE" ] && [ "$CONTRACT_BASE" != "0000000000000000000000000000000000000000" ]; then
            mise run contract:check -- --against "$CONTRACT_BASE"
          fi
      - run: mise exec -- go test ./internal/app/cli -run=^$ -fuzz=FuzzArgv -fuzztime=5s
      - run: mise exec -- go test ./internal/app/cli -run=^$ -bench=. -benchmem
      - run: mise exec -- go test -race ./...
      - run: mise exec -- goreleaser release --snapshot --clean --parallelism 2
      - run: mise run release:verify
  agent-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: 隔离应用状态目录
        shell: bash
        env:
          GO_CLI_STARTER_HOME: ${{ runner.temp }}/agent-mcp-home
        run: |
          printf 'GO_CLI_STARTER_HOME=%s\n' "$GO_CLI_STARTER_HOME" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      - run: mise run setup:agent
      - run: mise run mcp:check
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 隔离应用状态目录
        shell: bash
        env:
          GO_CLI_STARTER_HOME: ${{ runner.temp }}/go-cli-starter-home
        run: |
          printf 'GO_CLI_STARTER_HOME=%s\n' "$GO_CLI_STARTER_HOME" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      - run: mise run setup
      - name: 原生进程树、取消与资源所有权验收
        env:
          GO_CLI_STARTER_HOME: ${{ runner.temp }}/native-command-home
        run: mise exec -- go test -count=1 -timeout=90s ./internal/command -run 'Test(Windows|OwnedDescendants|RootExits|CleanupDoes|CancellationRetains)'
      - name: 原生模板构建与二进制验收
        env:
          GO_CLI_STARTER_HOME: ${{ runner.temp }}/template-starter-home
          MYCLI_HOME: ${{ runner.temp }}/template-mycli-home
        run: mise exec -- go test -count=1 ./tools/dev -run '^TestTemplateExecutable(Path|Acceptance)$'
      - run: mise exec -- go test ./...
      - run: mise run build
