min_version = "2026.10.21"

[settings]
lockfile = false
auto_install = false
exec_auto_install = false
task.run_auto_install = false

[env]
GOTOOLCHAIN = "local"

[tools]
go = "1.27.3"
"go:golang.org/x/tools/gopls" = "0.24.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
golangci-lint = "2.15.0"
goreleaser = "2.19.0"
syft = "1.55.0"

# 环境安装只由 setup 显式执行；其他任务只检查、构建或验收。
[tasks.setup]
description = "安装固定版本的开发工具并下载 Go 依赖"
run = ["mise install go golangci-lint goreleaser go:golang.org/x/vuln/cmd/govulncheck syft go:golang.org/x/tools/gopls", "go mod download"]

[tasks.doctor]
description = "检查已安装工具的固定版本，报告用户工具状态"
run = "go run ./tools/doctor"

[tasks.build]
description = "构建包含版本信息的本地程序"
run = "go run ./tools/build"

# lint 检查当前源码、资源和声明；lint:test 验证规则自身，只纳入 check。
[tasks.lint]
description = "只读检查格式、源码、双语资源、配置、包文档和版本声明"
depends = ["lint:i18n", "lint:config", "lint:doc", "lint:versions"]
run = ["golangci-lint fmt --diff --color=never", "golangci-lint run --allow-serial-runners"]

[tasks."lint:i18n"]
description = "检查双语消息、模板和参数一致性"
run = "go run ./tools/lint i18n"

[tasks."lint:config"]
description = "检查受管应用配置"
run = "go run ./tools/lint config"

[tasks."lint:doc"]
description = "检查各平台正式 Go 包的 doc.go 布局与有效包说明"
run = "go run ./tools/lint doc"

[tasks."lint:versions"]
description = "检查工具、模块、CI 和文档的版本声明一致性"
run = "go run ./tools/lint versions"

[tasks."lint:test"]
description = "用违规和合规 fixture 验证静态规则自身是否生效"
run = "go run ./tools/lint test"

# 完整源码检查包含生成项目验收；MCP、发布和安全扫描独立运行。
[tasks.check]
description = "运行完整源码检查、测试、构建和模板验收"
depends = ["lint", "build", "template:check", "contract:check", "lint:test"]
run = ["go mod tidy -diff", "go test ./...", "go vet ./..."]

[tasks."contract:check"]
description = "检查机器契约和兼容变更记录，不修改快照"
run = "go run ./tools/contract check"

[tasks."contract:update"]
description = "显式更新机器契约快照，须另写兼容变更记录"
run = "go run ./tools/contract update"

[tasks."template:init"]
description = "初始化模板身份：--module github.com/acme/mycli --name mycli"
run = "go run ./tools/template init"

[tasks."template:check"]
description = "在临时副本中验收初始化、lint、测试、构建和安装"
run = "go run ./tools/template check"

[tasks."mcp:check"]
description = "握手真实 gopls MCP，发现工具并诊断当前工作区"
run = "go run ./tools/mcp"

[tasks."release:verify"]
description = "验证六目标归档、SPDX、SHA-256，并隔离安装宿主归档"
run = "go run ./tools/release"
