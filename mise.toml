min_version = "2026.10.21"

[settings]
task.run_auto_install = false

[tools]
go = "1.27.3"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"go:golang.org/x/tools/gopls" = "0.24.0"
golangci-lint = "2.15.0"
goreleaser = "2.19.0"

[tasks.setup]
description = "安装锁定版本的工具并下载 Go 依赖"
run = ["mise install --locked go go:golang.org/x/tools/gopls golangci-lint goreleaser go:golang.org/x/vuln/cmd/govulncheck", "go mod download"]

[tasks.doctor]
description = "检查项目工具和锁定版本"
run = "go run ./tools/dev doctor"

[tasks."doctor:agent"]
description = "检查项目工具并报告用户级 Codex 辅助工具状态"
run = "go run ./tools/dev doctor-agent"

[tasks.fmt]
description = "格式化 Go 文件"
run = "go run ./tools/dev fmt"

[tasks."fmt:check"]
description = "检查 Go 格式，不修改文件"
run = "go run ./tools/dev fmt-check"

[tasks.test]
description = "运行单元测试和命令测试"
run = "go test ./..."

[tasks."test:race"]
description = "运行竞态检测（需要 C 编译器）"
run = "go test -race ./..."

[tasks.lint]
description = "运行锁定版本的静态检查工具"
run = "golangci-lint run"

[tasks.vet]
description = "运行 Go vet 检查"
run = "go vet ./..."

[tasks."mod:check"]
description = "检查模块元数据，不修改文件"
run = "go mod tidy -diff"

[tasks.build]
description = "构建包含版本信息的本地程序"
run = "go run ./tools/dev build"

[tasks."release:check"]
description = "验证发布配置"
run = "goreleaser check"

[tasks."template:check"]
description = "初始化并验证独立的临时项目"
run = "go run ./tools/dev template-check"

[tasks.check]
description = "运行与 CI 相同的源码检查"
depends = ["fmt:check", "mod:check", "test", "vet", "lint", "build", "template:check", "contract:check", "versions:check"]

[tasks.init]
description = "重命名原始模板：mise run init --module github.com/acme/mycli --name mycli"
run = "go run ./tools/init"

[tasks."mcp:check"]
description = "初始化 gopls MCP，发现工具并诊断当前工作区"
run = "go run ./tools/dev mcp-check"

[tasks."release:snapshot"]
description = "在本地构建全部发布压缩包，不执行发布"
run = "goreleaser release --snapshot --clean --parallelism 2"

[tasks."contract:check"]
description = "检查机器契约，不修改快照"
run = "go run ./tools/dev contract-check"

[tasks."contract:update"]
description = "显式更新机器契约快照，须另写兼容变更记录"
run = "go run ./tools/dev contract-update"

[tasks."versions:check"]
description = "检查工具锁、模块、CI 和当前文档版本一致性"
run = "go run ./tools/dev versions-check"

[tasks.vuln]
description = "联网检查受影响的 Go 漏洞，失败保留原因"
run = "go run ./tools/dev vuln"
