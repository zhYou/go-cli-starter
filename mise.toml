min_version = "2026.10.21"

[settings]
lockfile = false
auto_install = false
exec_auto_install = false
task.run_auto_install = false

[env]
GOTOOLCHAIN = "local"

[tools]
go = "1.27.3"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
golangci-lint = "2.15.0"
goreleaser = "2.19.0"
syft = "1.55.0"

[tasks.setup]
description = "安装固定版本的开发工具并下载 Go 依赖"
run = ["mise install go golangci-lint goreleaser go:golang.org/x/vuln/cmd/govulncheck syft", "go mod download"]

[tasks."setup:agent"]
description = "准备开发工具并安装固定版本的智能体辅助工具"
depends = ["setup"]
run = "mise -E agent install go:golang.org/x/tools/gopls"

[tasks.doctor]
description = "检查预装基础工具及开发工具的固定版本"
run = "go run ./tools/dev doctor"

[tasks."doctor:agent"]
description = "检查开发及智能体工作环境，报告预装辅助工具状态"
run = "mise -E agent exec -- go run ./tools/dev doctor-agent"

[tasks."i18n:check"]
description = "检查集中双语消息目录"
run = "go run ./tools/dev i18n-check"

[tasks."config:check"]
description = "检查受管应用配置"
run = "go run ./tools/dev config-check"

[tasks."doc:check"]
description = "检查正式 Go 包的 doc.go 与包说明位置"
run = "go run ./tools/dev doc-check"

[tasks.lint]
depends = ["i18n:check", "config:check", "doc:check"]
description = "检查双语消息、应用配置、包文档及固定版本的静态规则"
run = "golangci-lint run --allow-serial-runners"

[tasks.build]
description = "构建包含版本信息的本地程序"
run = "go run ./tools/dev build"

[tasks."template:check"]
description = "初始化并验证独立的临时项目"
run = "go run ./tools/dev template-check"

[tasks.check]
description = "运行与 CI 相同的源码检查"
depends = ["lint", "build", "template:check", "contract:check", "versions:check", "rules:check"]
run = ["golangci-lint fmt --diff --color=never", "go mod tidy -diff", "go test ./...", "go vet ./..."]

[tasks.init]
description = "重命名原始模板：mise run init --module github.com/acme/mycli --name mycli"
run = "go run ./tools/init"

[tasks."mcp:check"]
description = "初始化 gopls MCP，发现工具并诊断当前工作区"
run = "go run ./tools/dev mcp-check"

[tasks."contract:check"]
description = "检查机器契约，不修改快照"
run = "go run ./tools/dev contract-check"

[tasks."contract:update"]
description = "显式更新机器契约快照，须另写兼容变更记录"
run = "go run ./tools/dev contract-update"

[tasks."versions:check"]
description = "检查两层工具声明、模块、CI 和当前文档版本一致性"
run = "go run ./tools/dev versions-check"

[tasks."release:verify"]
description = "验证六目标归档、SPDX、SHA-256，并隔离安装宿主归档"
run = "go run ./tools/dev release-verify"

[tasks."rules:check"]
description = "用真实类型分析验证配置、日志和 Trace 边界"
run = "go run ./tools/dev rules-check"
