min_version = "2026.10.21"

[settings]
task.run_auto_install = false

[tools]
go = "1.27.3"
"go:golang.org/x/tools/gopls" = "0.24.0"
golangci-lint = "2.15.0"
goreleaser = "2.19.0"

[tasks.setup]
description = "Install pinned tools and download Go dependencies"
run = ["mise install --locked go go:golang.org/x/tools/gopls golangci-lint goreleaser", "go mod download"]

[tasks.doctor]
description = "Check project tools and pinned versions"
run = "go run ./tools/dev doctor"

[tasks."doctor:agent"]
description = "Check project tools and report user-level Codex helpers"
run = "go run ./tools/dev doctor-agent"

[tasks.fmt]
description = "Format Go files"
run = "go run ./tools/dev fmt"

[tasks."fmt:check"]
description = "Check Go formatting without changing files"
run = "go run ./tools/dev fmt-check"

[tasks.test]
description = "Run unit and command tests"
run = "go test ./..."

[tasks."test:race"]
description = "Run the race detector (requires a C compiler)"
run = "go test -race ./..."

[tasks.lint]
description = "Run the pinned linters"
run = "golangci-lint run"

[tasks.vet]
description = "Run Go vet"
run = "go vet ./..."

[tasks."mod:check"]
description = "Check module metadata without modifying it"
run = "go mod tidy -diff"

[tasks.build]
description = "Build a local binary with version metadata"
run = "go run ./tools/dev build"

[tasks."release:check"]
description = "Validate release configuration"
run = "goreleaser check"

[tasks."template:check"]
description = "Initialize and verify an independent temporary project"
run = "go run ./tools/dev template-check"

[tasks.check]
description = "Run the same source checks as CI"
depends = ["fmt:check", "mod:check", "test", "vet", "lint", "build", "template:check"]

[tasks.init]
description = "Rename a fresh template: mise run init --module github.com/acme/mycli --name mycli"
run = "go run ./tools/init"

[tasks."mcp:check"]
description = "Initialize gopls MCP, list tools, and diagnose this workspace"
run = "go run ./tools/dev mcp-check"

[tasks."release:snapshot"]
description = "Build all release archives locally without publishing"
run = "goreleaser release --snapshot --clean --parallelism 2"
