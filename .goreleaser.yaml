version: 2
project_name: go-cli-starter
builds:
  - id: cli
    main: ./cmd/go-cli-starter
    binary: go-cli-starter
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - src: configs/config.example.yaml
        dst: .
        strip_parent: true
sboms:
  - artifacts: archive
    documents: ["{{ .ArtifactName }}.spdx.json"]
    cmd: syft
    args:
      - scan
      - "file:$artifact"
      - --config
      - ../.syft.yaml
      - --source-name
      - "{{ .ArtifactName }}"
      - --output
      - "spdx-json=$document"
    env:
      - SYFT_CHECK_FOR_APP_UPDATE=false
      - SYFT_GOLANG_SEARCH_REMOTE_LICENSES=false
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
release:
  prerelease: auto
